[package]
name = "punto-de-ventas"
version = "0.1.0"
description = "Sistema POS genérico offline-first para comercios argentinos"
authors = ["PuntoDeVentas"]
edition = "2021"

[lib]
name = "punto_de_ventas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
